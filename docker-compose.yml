version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skin_disease_backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_SECRET_KEY=dev_flask_secret_key_987654321
      - CORS_ORIGINS=*
      - MODEL_DIR=/app/trained_models
    volumes:
      - ./trained_models:/app/trained_models
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skin_disease_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
