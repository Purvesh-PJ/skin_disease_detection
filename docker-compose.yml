services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skin_disease_backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_SECRET_KEY=dev_flask_secret_key_987654321
      - CORS_ORIGINS=*
      - MODEL_DIR=/app/trained_models
    volumes:
      - ./trained_models:/app/trained_models
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skin_disease_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  ml-engine:
    build:
      context: .
      dockerfile: ml_engine/Dockerfile
    container_name: skin_disease_ml_engine
    volumes:
      - ./ml_engine:/app/ml_engine
      - ./trained_models:/app/trained_models
    environment:
      - TF_ENABLE_ONEDNN_OPTS=0
    working_dir: /app
    stdin_open: true
    tty: true
